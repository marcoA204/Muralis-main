version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: muralis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: muralis_user
      POSTGRES_PASSWORD: muralis_password
      POSTGRES_DB: muralis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: muralis_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muralis_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://muralis_user:muralis_password@postgres:5432/muralis_db
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET: muralis-assets
      PORT: 3000
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
